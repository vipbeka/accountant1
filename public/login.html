<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — النظام المحاسبي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23d9a441'/><text x='50' y='68' font-size='52' text-anchor='middle'>ح</text></svg>">
<link rel="stylesheet" href="assets/css/style.css?v=10">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-circle">ح</div>
      <h1>النظام المحاسبي المتكامل</h1>
      <p class="sub">قيود اليومية • الأستاذ العام • ميزان المراجعة</p>

      <div id="errorBox" class="alert err" style="display:none"></div>

      <form id="loginForm">
        <div class="field">
          <label>اسم المستخدم</label>
          <input type="text" name="username" required autofocus autocomplete="username" placeholder="admin">
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-gold btn-block">دخــول</button>
      </form>

      <p style="margin-top:14px;text-align:center">
        <a href="forgot.html" style="color:var(--gold)">نسيت كلمة المرور؟</a>
      </p>

      <p style="margin-top:24px;color:var(--muted);font-size:12px;line-height:1.8">
        © جميع الحقوق محفوظة — <b style="color:var(--gold)">محاسب / محمد احمد</b>
      </p>
    </div>
  </div>

<script src="assets/js/vendor/supabase.js?v=3"></script>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/supabaseClient.js?v=3"></script>
<script src="assets/js/common.js?v=3"></script>
<script src="assets/js/pages/login.js?v=6"></script>
<script type="module" src="assets/js/firebase-init.js?v=3"></script>
</body>
</html>
