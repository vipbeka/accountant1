<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المصاريف — النظام المحاسبي</title><link rel="stylesheet" href="assets/css/style.css?v=12"></head>
<body data-page-title="مصاريف الشركة"><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><header class="topbar" id="topbar"></header><div class="content">
  <div class="panel"><div class="panel-head"><h3>🧾 مصاريف الشركة</h3><div id="toolbar"></div><input id="expense-import-file" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExpensesExcel(this)"></div>
    <div class="filters"><div class="field"><label>بحث</label><input id="flt-q" placeholder="الرقم أو البيان أو الجهة"></div><div class="field"><label>النوع</label><select id="flt-type"><option value="">الكل</option><option>إيجار</option><option>كهرباء ومياه</option><option>اتصالات</option><option>نقل</option><option>صيانة</option><option>أدوات مكتبية</option><option>ضيافة</option><option>أخرى</option></select></div><div class="field"><label>الحالة</label><select id="flt-status"><option value="">الكل</option><option value="draft">مسودة</option><option value="posted">مرحل</option></select></div><button class="btn btn-dark" onclick="renderExpenses()">عرض</button></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الرقم</th><th>التاريخ</th><th>النوع</th><th>الجهة</th><th>البيان</th><th class="num">المبلغ</th><th>الحالة</th><th></th></tr></thead><tbody id="expense-body"></tbody></table></div>
  </div>
  <div class="modal-overlay" id="expenseModal"><div class="modal" style="max-width:720px"><div class="modal-head"><h3 id="expense-title">مصروف جديد</h3><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><div class="grid-2"><div class="field"><label>التاريخ *</label><input id="x-date" type="date"></div><div class="field"><label>نوع المصروف *</label><select id="x-type"><option>إيجار</option><option>كهرباء ومياه</option><option>اتصالات</option><option>نقل</option><option>صيانة</option><option>أدوات مكتبية</option><option>ضيافة</option><option>أخرى</option></select></div><div class="field"><label>الجهة / المستفيد</label><input id="x-party"></div><div class="field"><label>المبلغ *</label><input id="x-amount" type="number" min="0" step="0.01"></div><div class="field"><label>حساب المصروف *</label><select id="x-account"></select></div><div class="field"><label>الدفع من *</label><select id="x-cash"></select></div><div class="field" style="grid-column:span 2"><label>البيان</label><textarea id="x-desc" rows="3"></textarea></div><div class="field" style="grid-column:span 2"><label>إيصال أو مرفق (اختياري، حتى 1.5 ميجابايت)</label><input id="x-file" type="file" accept=".pdf,.jpg,.jpeg,.png"></div></div></div><div class="modal-foot"><button class="btn btn-gold" onclick="saveExpense('draft')">حفظ مسودة</button><button class="btn btn-teal" onclick="saveExpense('posted')">حفظ وترحيل</button><button class="btn btn-dark" data-close-modal>إلغاء</button></div></div></div>
</div><footer class="footer-note">© جميع الحقوق محفوظة — <b>محاسب / محمد احمد</b></footer></main></div>
<script src="assets/js/vendor/supabase.js?v=3"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="assets/js/config.js?v=3"></script><script src="assets/js/supabaseClient.js?v=4"></script><script src="assets/js/common.js?v=3"></script><script src="assets/js/auth.js?v=17"></script><script src="assets/js/db.js?v=18"></script><script src="assets/js/ext-store.js?v=10"></script><script src="assets/js/expenses-store.js?v=5"></script><script src="assets/js/expenses-import.js?v=1"></script><script src="assets/js/form-draft.js?v=3"></script><script src="assets/js/pages/expenses.js?v=7"></script><script type="module" src="assets/js/firebase-init.js?v=3"></script>
</body></html>
