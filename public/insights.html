<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الذكاء المحاسبي — النظام المحاسبي</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .flag { border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .flag.err { background:#3a1520; color:#ffb4c0; }
  .flag.warn { background:#3a2e14; color:#ffd48a; }
  .flag.ok { background:#143326; color:#9dffc6; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:16px; }
  .tpl { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); }
</style>
</head>
<body data-page-title="الذكاء المحاسبي">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="kpi" id="kpis"></div>
      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>تشخيص القيود والمعادلة</h3></div>
          <div class="panel-body" id="flags"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>قوالب قيود جاهزة</h3></div>
          <div class="panel-body" id="templates"></div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="panel-head"><h3>صافي الحسابات من القيود المرحلة</h3></div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>الحساب</th><th>الاسم</th><th>مدين</th><th>دائن</th><th>الصافي</th></tr></thead>
            <tbody id="bal-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <footer class="footer-note">© جميع الحقوق محفوظة — <b>محاسب / أحمد عبدالله</b></footer>
  </main>
</div>
<script src="assets/js/vendor/supabase.js?v=3"></script>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/supabaseClient.js?v=3"></script>
<script src="assets/js/common.js?v=3"></script>
<script src="assets/js/auth.js?v=15"></script>
<script src="assets/js/db.js?v=15"></script>
<script src="assets/js/smart-accounting.js?v=4"></script>
<script src="assets/js/pages/insights.js?v=4"></script>
</body>
</html>
