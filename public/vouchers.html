<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سندات القبض والصرف — النظام المحاسبي</title>
<link rel="stylesheet" href="assets/css/style.css?v=12">
</head>
<body data-page-title="سندات القبض والصرف">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="content">
      <div class="panel">
        <div class="panel-head">
          <h3>💵 سندات القبض والصرف</h3>
          <div class="toolbar" id="toolbar"></div>
        </div>
        <div class="filters">
          <div class="field"><label>النوع</label>
            <select id="flt-kind">
              <option value="">الكل</option>
              <option value="receipt">قبض</option>
              <option value="payment">صرف</option>
              <option value="salary">راتب</option>
            </select></div>
          <div class="field"><label>الحالة</label>
            <select id="flt-status"><option value="">الكل</option><option value="draft">مسودة</option><option value="posted">مرحل</option></select></div>
          <div class="field"><label>بحث</label><input id="flt-q" type="text" placeholder="رقم / بيان"></div>
          <button class="btn btn-teal" onclick="renderList()">🔍 عرض</button>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th class="num">الرقم</th><th class="num">التاريخ</th><th>النوع</th><th>الطرف</th>
                <th>البيان</th><th class="num">المبلغ</th><th class="num">الحالة</th><th class="num">إجراءات</th>
              </tr>
            </thead>
            <tbody id="v-body"></tbody>
          </table>
        </div>
      </div>

      <div class="modal-overlay" id="vModal">
        <div class="modal wide">
          <div class="modal-head"><h3 id="v-title">سند جديد</h3>
            <button class="modal-close" data-close-modal>×</button></div>
          <div class="modal-body">
            <div class="entry-meta">
              <div class="field"><label>النوع *</label>
                <select id="v-kind" onchange="onVKind()">
                  <option value="receipt">سند قبض</option>
                  <option value="payment">سند صرف</option>
                  <option value="salary">صرف راتب</option>
                </select></div>
              <div class="field"><label>التاريخ *</label><input id="v-date" type="date"></div>
              <div class="field"><label>المنطقة *</label><select id="v-region"></select></div>
              <div class="field"><label>الطرف</label><select id="v-party"></select></div>
              <div class="field"><label>المبلغ *</label><input id="v-amt" type="number" step="0.01" min="0"></div>
              <div class="field"><label>ربط بفاتورة (اختياري)</label><select id="v-inv"></select></div>
              <div class="field"><label id="lbl-cash">حساب الصندوق / البنك *</label><select id="v-cash"></select></div>
              <div class="field"><label id="lbl-off">الحساب المقابل (عملاء/موردين/مصروف) *</label><select id="v-off"></select></div>
              <div class="field" style="grid-column:span 2"><label>البيان</label><input id="v-desc" type="text" placeholder="مثال: تحصيل من عميل / سداد مورد / راتب سبتمبر"></div>
            </div>
            <p class="hint">سند القبض: مدين صندوق/بنك — دائن العملاء. سند الصرف: مدين المورد/المصروف — دائن صندوق/بنك. يُرحَّل كقيد يومية متوازن.</p>
          </div>
          <div class="modal-foot">
            <button class="btn btn-dark" onclick="saveV('draft')">💾 حفظ مسودة</button>
            <button class="btn btn-green" onclick="saveV('posted')">✅ حفظ وترحيل قيد</button>
            <button class="btn btn-dark" data-close-modal>إلغاء</button>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer-note">© جميع الحقوق محفوظة — <b>محاسب / محمد احمد</b></footer>
  </main>
</div>
<script src="assets/js/vendor/supabase.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/supabaseClient.js?v=4"></script>
<script src="assets/js/common.js?v=3"></script>
<script src="assets/js/auth.js?v=17"></script>
<script src="assets/js/db.js?v=18"></script>
<script src="assets/js/ext-store.js?v=10"></script>
<script src="assets/js/hr-store.js?v=5"></script>
<script src="assets/js/pages/vouchers.js?v=6"></script>
<script type="module" src="assets/js/firebase-init.js?v=3"></script>

<script>
(function () {
  var css = document.createElement('style');
  css.textContent = '@media (max-width:900px){'
    + '.menu-btn{display:inline-flex!important;align-items:center;justify-content:center;width:44px;height:44px;min-width:44px;border:0;border-radius:12px;background:linear-gradient(145deg,#e8c56a,#b9862b);color:#161006;font-size:22px;font-weight:800;}'
    + '.layout{flex-direction:row!important;}'
    + '.sidebar{display:none!important;position:fixed!important;top:0;right:0;left:auto;width:min(300px,88vw)!important;height:100vh!important;z-index:90;flex-direction:column!important;flex-wrap:nowrap!important;overflow:auto;background:#12182a;}'
    + '.sidebar.open{display:flex!important;}'
    + '.sidebar .nav{flex-direction:column!important;flex-wrap:nowrap!important;width:100%;}'
    + '.drawer-close{display:inline-flex!important;margin-right:auto;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;font-size:18px;}'
    + '.sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(5,8,15,.6);z-index:85;}'
    + '}'
    + '.sidebar-backdrop{display:none;}';
  document.head.appendChild(css);
  function close() {
    var s = document.getElementById('sidebar');
    var b = document.getElementById('sidebar-backdrop');
    if (s) s.classList.remove('open');
    if (b) b.classList.remove('show');
  }
  function open() {
    var s = document.getElementById('sidebar');
    var b = document.getElementById('sidebar-backdrop');
    if (s) s.classList.add('open');
    if (b) b.classList.add('show');
  }
  function boot() {
    var top = document.getElementById('topbar');
    var side = document.getElementById('sidebar');
    if (!top || !side || !side.querySelector('a')) return false;
    if (!document.getElementById('sidebar-backdrop')) {
      var bd = document.createElement('div');
      bd.id = 'sidebar-backdrop';
      bd.className = 'sidebar-backdrop';
      document.body.appendChild(bd);
      bd.addEventListener('click', close);
    }
    if (!document.getElementById('menuBtn')) {
      var btn = document.createElement('button');
      btn.id = 'menuBtn';
      btn.className = 'menu-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label', 'القائمة');
      btn.textContent = '\u2630';
      top.insertBefore(btn, top.firstChild);
    }
    var brand = side.querySelector('.brand');
    if (brand && !document.getElementById('drawerClose')) {
      var x = document.createElement('button');
      x.id = 'drawerClose';
      x.className = 'drawer-close';
      x.type = 'button';
      x.textContent = '\u2715';
      brand.appendChild(x);
      x.addEventListener('click', close);
    }
    document.getElementById('menuBtn').onclick = open;
    side.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', close); });
    return true;
  }
  var n = 0;
  var timer = setInterval(function () { if (boot() || ++n > 50) clearInterval(timer); }, 200);
})();
</script>

</body>
</html>
